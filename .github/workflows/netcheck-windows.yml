name: netcheck-windows
on:
  push:
    branches: [netcheck-windows-test]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Go unit tests
        working-directory: go
        run: go test ./...
      - name: Build exe
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o ../dist/cresclab-netcheck.exe .
      - name: Run both tools on an open network
        shell: pwsh
        run: ./.github/run-and-verify.ps1 -Phase open
      - name: Block the Crescendo Lab Cloudflare IPs
        shell: pwsh
        run: |
          Set-NetFirewallProfile -All -Enabled True
          New-NetFirewallRule -DisplayName block-cresclab -Direction Outbound -RemoteAddress 104.18.4.188,104.18.5.188 -Action Block | Out-Null
          curl.exe -sS -o NUL -m 8 -w "maac after block: http=%{http_code}`n" https://maac.cresclab.com/ ; exit 0
      - name: Run both tools on a blocked network
        shell: pwsh
        run: ./.github/run-and-verify.ps1 -Phase blocked
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netcheck-windows
          path: |
            reports/
            dist/cresclab-netcheck.exe
