[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
goreleaser = "2.19.0"

[env]
# Build with the Go version pinned above instead of letting go.mod download another one.
GOTOOLCHAIN = "local"

[tasks.lint]
description = "Run golangci-lint for every target OS"
run = [
  "golangci-lint run",
  "GOOS=windows golangci-lint run",
  "GOOS=linux golangci-lint run",
]

[tasks.test]
description = "Run unit tests"
run = "go test -race ./..."

[tasks.snapshot]
description = "Build and package every release target into dist/ without publishing"
run = "goreleaser release --snapshot --clean"

[tasks.check]
description = "Run everything CI runs before a release"
depends = ["lint", "test"]
run = "goreleaser check"
